name: restore-workspaces-source

on:
  workflow_dispatch:
  push:
    branches:
      - phase-5b-work

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5b-work
          fetch-depth: 0
      - name: Restore ignored application source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path

          root = Path("backend/src/agent_office/application/workspaces")
          root.mkdir(parents=True, exist_ok=True)
          payloads = {}
        payloads["__init__.py"] = ""
        payloads["errors.py"] = ""
        payloads["ports.py"] = ""
        payloads["service.py"] = ""
          for name, payload in payloads.items():
              root.joinpath(name).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          find backend/src/agent_office/application/workspaces -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/restore-workspaces.yml
          git config user.name "Agent Office CI"
          git config user.email "agent-office-ci@users.noreply.github.com"
          git add -f backend/src/agent_office/application/workspaces
          git add .github/workflows/restore-workspaces.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: track workspace application source"
          git push origin HEAD:phase-5b-work
